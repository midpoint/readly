name = "readly"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/accounts", "/accounts/*", "/reader", "/reader/*", "/fever", "/fever/*", "/fever.php"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "readly"
database_id = "13206adf-135f-4dbd-a43d-82ec7ce18451"
