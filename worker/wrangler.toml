name = "readly"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "readly"
database_id = "PLACEHOLDER_REPLACE_AFTER_D1_CREATE"
